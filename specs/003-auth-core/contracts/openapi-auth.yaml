# Intended OpenAPI 3.1 additions for feature 003 (design contract).
# The generated document (`go run ./cmd/divya openapi` -> packages/api-client/openapi.yaml) is authoritative;
# this file states what the Go code must produce. Schema names follow Go type names in internal/auth.
# 002's POST /internal/tick is a Hidden operation: it never appears here; it declares authz.SelfAuthenticated() (plan C-8).
openapi: 3.1.0
info: { title: Divya API, version: dev }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (EdDSA JWT, 15 min). Requirement scopes list allowed roles; empty = any signed-in role.
    mfaChallenge:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Interim second-factor proof (dmc_…), 5 min, single use. Accepted only by MFA completion/enrolment operations.
  schemas:
    ErrorModel:            # existing schema; additive property
      properties:
        code:
          type: string
          description: Stable, language-neutral problem code (see contracts/error-codes.md). Also encoded in `type` as urn:divya:problem:<code>.
          examples: [auth.invalid_credentials]
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [id, name, platform]
      properties:
        id: { type: string, format: uuid, description: Installation identity generated by the app }
        name: { type: string, minLength: 1, maxLength: 100 }
        platform: { type: string, enum: [android, iphone, web] }
    SignInRequest:
      type: object
      additionalProperties: false
      required: [identifier, password, client_type, device]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 320, description: Email, or Indian mobile in any D-17 form }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
        client_type: { type: string, enum: [mobile, web], description: "mobile: refresh token in body; web: refresh token only in HttpOnly cookie" }
        device: { $ref: "#/components/schemas/DeviceInfo" }
    UserSummary:
      type: object
      required: [id, role, name, email]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [admin, client] }
        name: { type: string }
        email: { type: string }
    SessionTokens:
      type: object
      required: [access_token, token_type, access_token_expires_at, session_id, session_expires_at, idle_expires_at, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, description: "Present only for client_type=mobile (drt_…)." }
        session_id: { type: string, format: uuid }
        session_expires_at: { type: string, format: date-time, description: Absolute expiry }
        idle_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/UserSummary" }
    Challenge:
      type: object
      required: [challenge_token, expires_at]
      properties:
        challenge_token: { type: string, description: "dmc_…; send as Authorization: Bearer" }
        expires_at: { type: string, format: date-time }
    SignInResponse:
      type: object
      required: [next_step]
      properties:
        next_step: { type: string, enum: [signed_in, mfa_required, mfa_enrolment_required] }
        session: { $ref: "#/components/schemas/SessionTokens", description: "Present when next_step=signed_in" }
        challenge: { $ref: "#/components/schemas/Challenge", description: "Present when next_step is mfa_*" }
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      description: Exactly one of code or recovery_code (422 otherwise).
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
        recovery_code: { type: string, minLength: 16, maxLength: 24 }
    TotpCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
    TotpSecret:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32, shown once }
        otpauth_uri: { type: string, description: "otpauth://totp/Divya:<email>?secret=…&issuer=Divya&algorithm=SHA1&digits=6&period=30" }
    EnrolmentResult:
      type: object
      required: [session, recovery_codes]
      properties:
        session: { $ref: "#/components/schemas/SessionTokens" }
        recovery_codes: { type: array, minItems: 10, maxItems: 10, items: { type: string }, description: Shown once }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id: { type: string, format: uuid }
        refresh_token: { type: string, maxLength: 128, description: "Mobile only. Omit for web (cookie)." }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 1024, format: password }
        new_password: { type: string, minLength: 1, maxLength: 2048, format: password, description: Policy D-07 enforced server-side with specific codes }
    ReauthWithCode:
      type: object
      additionalProperties: false
      required: [password, code]
      properties:
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
        code: { type: string, pattern: "^[0-9]{6}$" }
    ReauthWithCodeOrRecovery:
      type: object
      additionalProperties: false
      required: [password]
      description: password plus exactly one of code / recovery_code.
      properties:
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
        code: { type: string, pattern: "^[0-9]{6}$" }
        recovery_code: { type: string, minLength: 16, maxLength: 24 }
    Device:
      type: object
      required: [session_id, device_name, platform, signed_in_at, last_active_at, is_current]
      properties:
        session_id: { type: string, format: uuid }
        device_name: { type: string }
        platform: { type: string, enum: [android, iphone, web] }
        signed_in_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }
        is_current: { type: boolean, description: Always false in admin listings of other users }
    DeviceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Device" } }
  parameters:
    WebOrigin: { name: Origin, in: header, required: false, schema: { type: string } }
    CsrfHeader: { name: X-Divya-CSRF, in: header, required: false, schema: { type: string, enum: ["1"] }, description: Required when the refresh cookie is used and for client_type=web }
    RefreshCookie: { name: __Secure-divya_rt, in: cookie, required: false, schema: { type: string } }
  headers:
    SetRefreshCookie:
      description: "web only: __Secure-divya_rt=…; Path=/v1/auth/refresh; HttpOnly; Secure; SameSite=Strict; Max-Age=<to absolute expiry> (Max-Age=0 to clear)"
      schema: { type: string }
paths:
  /healthz: { get: { operationId: health-live, security: [] } }      # existing; adds explicit empty security
  /readyz:  { get: { operationId: health-ready, security: [] } }     # existing; adds explicit empty security
  /v1/auth/sign-in:
    post:
      operationId: auth-sign-in
      tags: [Auth]
      security: []
      parameters: [{ $ref: "#/components/parameters/WebOrigin" }, { $ref: "#/components/parameters/CsrfHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SignInRequest" } } } }
      responses:
        "200": { description: OK, headers: { Set-Cookie: { $ref: "#/components/headers/SetRefreshCookie" } }, content: { application/json: { schema: { $ref: "#/components/schemas/SignInResponse" } } } }
        default: { description: "401 auth.invalid_credentials | 422 auth.identifier_invalid, validation_failed | 403 auth.csrf_rejected | 429 rate_limited | 503 auth.busy, auth.not_configured" }
  /v1/auth/mfa/verify:
    post:
      operationId: auth-mfa-verify
      tags: [Auth]
      security: [{ mfaChallenge: [] }]
      parameters: [{ $ref: "#/components/parameters/WebOrigin" }, { $ref: "#/components/parameters/CsrfHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MfaVerifyRequest" } } } }
      responses:
        "200": { description: OK, headers: { Set-Cookie: { $ref: "#/components/headers/SetRefreshCookie" } }, content: { application/json: { schema: { $ref: "#/components/schemas/SessionTokens" } } } }
        default: { description: "401 auth.unauthenticated (challenge) | 401 auth.invalid_credentials (code, locked) | 403 auth.csrf_rejected (web) | 422 | 429" }
  /v1/auth/mfa/enrolment:
    post:
      operationId: auth-mfa-enrolment-start
      tags: [Auth]
      security: [{ mfaChallenge: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TotpSecret" } } } }
        default: { description: "401 auth.unauthenticated | 429" }
  /v1/auth/mfa/enrolment/confirm:
    post:
      operationId: auth-mfa-enrolment-confirm
      tags: [Auth]
      security: [{ mfaChallenge: [] }]
      parameters: [{ $ref: "#/components/parameters/WebOrigin" }, { $ref: "#/components/parameters/CsrfHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TotpCodeRequest" } } } }
      responses:
        "200": { description: OK, headers: { Set-Cookie: { $ref: "#/components/headers/SetRefreshCookie" } }, content: { application/json: { schema: { $ref: "#/components/schemas/EnrolmentResult" } } } }
        default: { description: "401 auth.unauthenticated, auth.invalid_credentials | 403 auth.csrf_rejected (web) | 409 auth.mfa_no_pending_secret | 422" }
  /v1/auth/refresh:
    post:
      operationId: auth-refresh
      tags: [Auth]
      security: []
      parameters: [{ $ref: "#/components/parameters/WebOrigin" }, { $ref: "#/components/parameters/CsrfHeader" }, { $ref: "#/components/parameters/RefreshCookie" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } } }
      responses:
        "200": { description: OK, headers: { Set-Cookie: { $ref: "#/components/headers/SetRefreshCookie" } }, content: { application/json: { schema: { $ref: "#/components/schemas/SessionTokens" } } } }
        default: { description: "401 auth.refresh_rejected | 403 auth.csrf_rejected | 422 | 429" }
  /v1/auth/sign-out:
    post:
      operationId: auth-sign-out
      tags: [Auth]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Signed out, headers: { Set-Cookie: { $ref: "#/components/headers/SetRefreshCookie" } } }
        default: { description: "401 auth.unauthenticated" }
  /v1/auth/sign-out-everywhere:
    post:
      operationId: auth-sign-out-everywhere
      tags: [Auth]
      security: [{ bearer: [] }]
      responses:
        "204": { description: All sessions ended including this one, headers: { Set-Cookie: { $ref: "#/components/headers/SetRefreshCookie" } } }
        default: { description: "401 auth.unauthenticated" }
  /v1/auth/devices:
    get:
      operationId: auth-devices-list
      tags: [Auth]
      security: [{ bearer: [] }]
      responses:
        "200": { description: Live device sessions of the caller, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceList" } } } }
        default: { description: "401 auth.unauthenticated" }
  /v1/auth/devices/{sessionId}:
    delete:
      operationId: auth-device-revoke
      tags: [Auth]
      security: [{ bearer: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Revoked }
        default: { description: "401 auth.unauthenticated | 404 auth.device_not_found (also for other users' sessions)" }
  /v1/auth/password/change:
    post:
      operationId: auth-password-change
      tags: [Auth]
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangePasswordRequest" } } } }
      responses:
        "204": { description: Changed; other sessions ended }
        default: { description: "401 auth.unauthenticated | 403 auth.reauth_failed | 422 auth.password_too_short, auth.password_too_long, auth.password_matches_identifier, auth.password_too_common, auth.password_unchanged | 503 auth.busy" }
  /v1/auth/mfa/recovery-codes:
    post:
      operationId: auth-recovery-codes-regenerate
      tags: [Auth]
      security: [{ bearer: [admin] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReauthWithCode" } } } }
      responses:
        "200": { description: New set; previous set invalid, content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryCodes" } } } }
        default: { description: "401 | 403 auth.forbidden, auth.reauth_failed | 422" }
  /v1/auth/mfa/authenticator:
    post:
      operationId: auth-authenticator-replace-start
      tags: [Auth]
      security: [{ bearer: [admin] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReauthWithCodeOrRecovery" } } } }
      responses:
        "200": { description: Pending new secret, content: { application/json: { schema: { $ref: "#/components/schemas/TotpSecret" } } } }
        default: { description: "401 | 403 auth.forbidden, auth.reauth_failed | 422" }
  /v1/auth/mfa/authenticator/confirm:
    post:
      operationId: auth-authenticator-replace-confirm
      tags: [Auth]
      security: [{ bearer: [admin] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TotpCodeRequest" } } } }
      responses:
        "204": { description: Replaced; other admin sessions ended }
        default: { description: "401 | 403 auth.forbidden, auth.reauth_failed | 409 auth.mfa_no_pending_secret | 422" }
  /v1/admin/users/{userId}/devices:
    get:
      operationId: auth-admin-user-devices-list
      tags: [Admin users]
      security: [{ bearer: [admin] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceList" } } } }
        default: { description: "401 | 403 auth.forbidden | 404 auth.user_not_found" }
  /v1/admin/users/{userId}/devices/{sessionId}:
    delete:
      operationId: auth-admin-user-device-revoke
      tags: [Admin users]
      security: [{ bearer: [admin] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        default: { description: "401 | 403 auth.forbidden | 404 auth.user_not_found, auth.device_not_found" }
  /v1/admin/users/{userId}/sessions/end-all:
    post:
      operationId: auth-admin-user-sessions-end-all
      tags: [Admin users]
      security: [{ bearer: [admin] }]
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: All sessions of the user ended }
        default: { description: "401 | 403 auth.forbidden | 404 auth.user_not_found" }
