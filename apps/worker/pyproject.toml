[project]
name = "divya-worker"
version = "0.1.0"
description = "Divya data and AI worker: IPO data import, subscription refresh, prospectus briefs."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.400",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divya_worker"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "PT", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
