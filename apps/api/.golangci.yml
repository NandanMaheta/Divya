version: "2"
run:
  timeout: 5m
issues:
  # Report every linter that fires on a line, so a boundary violation (depguard, forbidigo)
  # is never hidden behind a style finding on the same line.
  uniq-by-line: false
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    depguard:
      rules:
        # Modular monolith boundaries: platform code must not depend on business modules.
        platform-is-a-leaf:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: "github.com/NandanMaheta/swastik/apps/api/internal/health"
              desc: platform packages must not import business modules
            - pkg: "github.com/NandanMaheta/swastik/apps/api/internal/scheduler"
              desc: platform packages must not import business modules
            - pkg: "github.com/NandanMaheta/swastik/apps/api/internal/outbox"
              desc: platform packages must not import business modules
            - pkg: "github.com/NandanMaheta/swastik/apps/api/internal/auth"
              desc: platform packages must not import business modules
        outbox-does-not-know-scheduler:
          files: ["**/internal/outbox/**"]
          deny:
            - pkg: "github.com/NandanMaheta/swastik/apps/api/internal/scheduler"
              desc: scheduler depends on outbox, never the reverse
        oidc-only-in-tickauth:
          files: ["$all", "!**/internal/platform/tickauth/**"]
          deny:
            - pkg: "github.com/coreos/go-oidc/v3"
              desc: OIDC verification lives in platform/tickauth
        jose-only-in-auth-and-tickauth:
          files: ["$all", "!**/internal/auth/**", "!**/internal/platform/tickauth/**"]
          deny:
            - pkg: "github.com/go-jose/go-jose/v4"
              desc: access tokens are issued and verified only in internal/auth (tickauth uses it via go-oidc and in tests)
        password-and-otp-primitives-in-auth:
          files: ["$all", "!**/internal/auth/**"]
          deny:
            - pkg: "golang.org/x/crypto/argon2"
              desc: password hashing lives only in internal/auth
            - pkg: "github.com/pquerna/otp"
              desc: TOTP lives only in internal/auth
        # pgx types live only in internal/auth/store_pg*.go. Tests and the authtest sub-package
        # (test support that opens pools) are allowed.
        pgx-only-in-store-pg:
          files:
            - "**/internal/auth/*.go"
            - "!**/internal/auth/store_pg*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/jackc/pgx/v5"
              desc: pgx types live only in internal/auth/store_pg*.go
        no-legacy-libs:
          deny:
            - pkg: "github.com/pkg/errors"
              desc: use the standard library errors package
            - pkg: "github.com/lib/pq"
              desc: use pgx v5
            - pkg: "gorm.io/gorm"
              desc: use sqlc-generated queries
    forbidigo:
      forbid:
        - pattern: '^time\.(Now|Since|Until)$'
          msg: inject a clock.Func (constitution III)
        - pattern: '^time\.Local$'
          msg: use istdate.IST; never the host time zone
      analyze-types: true
    wrapcheck:
      # Our own packages already wrap with context; only third-party errors must be wrapped.
      ignore-package-globs:
        - github.com/NandanMaheta/swastik/*
      ignore-sigs:
        - huma.Error
        - .Errorf(
        - errors.New(
    revive:
      rules:
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck, noctx, prealloc, contextcheck, unparam]
      - path: cmd/
        linters: [wrapcheck]
      # Real clock and request timing are the only places allowed to read the machine clock.
      - path: (cmd/|internal/platform/clock/|internal/platform/httpx/)
        linters: [forbidigo]
      - path: _test\.go
        linters: [forbidigo]
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/NandanMaheta/swastik]
