name: Deploy
on:
  push:
    branches: [stage] # -> staging
    tags: ["v*"] # -> production (needs owner approval on the environment)
permissions:
  contents: read
  id-token: write # Workload Identity Federation: no long-lived cloud keys
concurrency:
  group: deploy-${{ github.ref }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v5
      - name: Check deployment is configured
        id: cfg
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "Deployment not configured yet (feature 027). Skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.skip != 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: steps.cfg.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@v3
      - name: Build and push images
        if: steps.cfg.outputs.skip != 'true'
        run: |
          REG=asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/swastik
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker build -t $REG/api:${{ github.sha }} --build-arg VERSION=${{ github.ref_name }} apps/api
          docker build -t $REG/worker:${{ github.sha }} apps/worker
          docker push $REG/api:${{ github.sha }} && docker push $REG/worker:${{ github.sha }}
      - name: Migrate and deploy to Cloud Run (Mumbai)
        if: steps.cfg.outputs.skip != 'true'
        run: |
          REG=asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/swastik
          gcloud run jobs deploy swastik-migrate --image $REG/api:${{ github.sha }} --args migrate,up \
            --region asia-south1 --set-secrets DATABASE_URL=database-url:latest --execute-now --wait
          gcloud run deploy swastik-api --image $REG/api:${{ github.sha }} --region asia-south1 \
            --set-secrets DATABASE_URL=database-url:latest --set-env-vars APP_ENV=${{ vars.APP_ENV }},TICK_AUDIENCE=${{ vars.TICK_AUDIENCE }},TICK_SERVICE_ACCOUNT=${{ vars.TICK_SERVICE_ACCOUNT }}
          gcloud run deploy swastik-worker --image $REG/worker:${{ github.sha }} --region asia-south1 --no-allow-unauthenticated
      - name: Smoke test
        if: steps.cfg.outputs.skip != 'true'
        run: curl -fsS "${{ vars.API_BASE_URL }}/readyz"
