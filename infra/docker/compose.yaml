name: divya
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: divya
      POSTGRES_PASSWORD: divya
      POSTGRES_DB: divya
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divya"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
